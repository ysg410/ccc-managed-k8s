# In-cluster fixtures for the CCC.K8S behavioural tests, ported from upstream
# common-cloud-controls modules/cloud-api-test/terraform/azure/modules/kubernetes/fixtures
# (branch managed-k8s-behavioural). 40-setup-ccc-tests.sh applies this file and
# annotates ccc-wi-sa with the test workload identity's client ID.
#
# Two kinds of objects:
#   - test targets the scenarios read or act on (namespaces, service accounts,
#     secrets, listeners, a running security probe);
#   - guardrails scoped to the ccc-test namespace, as in upstream CI: Pod
#     Security "restricted", default-deny network policies, LimitRange,
#     ResourceQuota and ValidatingAdmissionPolicies (digest-pinned images, no
#     static cloud credentials, no blocked storage class / RWX claims).
# The storage-class admission policy is cluster wide (as upstream) but only
# rejects claims for ccc-blocked-sc or ReadWriteMany.
# Remove everything with 95-destroy-ccc-tests.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: ccc-test
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    environment: test
    owner: ccc-workshop
    data-classification: internal
---
apiVersion: v1
kind: Namespace
metadata:
  name: ccc-network-control
  labels:
    pod-security.kubernetes.io/enforce: baseline
    environment: test
    owner: ccc-workshop
    data-classification: internal
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ccc-wi-sa
  namespace: ccc-test
  labels:
    azure.workload.identity/use: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ccc-wi-sa-unbound
  namespace: ccc-test
---
apiVersion: v1
kind: Secret
metadata:
  name: ccc-protected-secret
  namespace: ccc-test
type: Opaque
stringData:
  value: ccc-protected-secret-value
---
apiVersion: v1
kind: Secret
metadata:
  name: ccc-unrelated-secret
  namespace: ccc-test
type: Opaque
stringData:
  value: ccc-unrelated-secret-value
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ccc-protected-secret-get
  namespace: ccc-test
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ccc-protected-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ccc-protected-secret-get
  namespace: ccc-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ccc-protected-secret-get
subjects:
  - kind: ServiceAccount
    name: ccc-wi-sa
    namespace: ccc-test
---
# CN06: default deny in the test namespace, DNS allowed, then narrow allows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ccc-default-deny
  namespace: ccc-test
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ccc-allow-dns
  namespace: ccc-test
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
---
# CN03.AR01: the workload identity probe job must reach Entra ID and Storage.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ccc-allow-wi-probe
  namespace: ccc-test
spec:
  podSelector:
    matchLabels:
      role: wi-probe
  policyTypes: ["Egress"]
  egress:
    - ports:
        - { port: 443, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ccc-allow-probe-to-allowed
  namespace: ccc-test
spec:
  podSelector:
    matchLabels:
      role: network-probe
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ccc-network-control
          podSelector:
            matchLabels:
              app: ccc-allowed
      ports:
        - { port: 8080, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ccc-default-deny-ingress
  namespace: ccc-network-control
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ccc-allow-from-network-probe
  namespace: ccc-network-control
spec:
  podSelector:
    matchLabels:
      app: ccc-allowed
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ccc-test
          podSelector:
            matchLabels:
              role: network-probe
      ports:
        - { port: 8080, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ccc-allow-from-network-control
  namespace: ccc-network-control
spec:
  podSelector:
    matchLabels:
      app: ccc-allowed
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ccc-network-control
      ports:
        - { port: 8080, protocol: TCP }
---
# CN10: approved and blocked storage classes.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ccc-approved-sc
provisioner: disk.csi.azure.com
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
parameters:
  skuname: StandardSSD_LRS
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ccc-blocked-sc
  annotations:
    ccc.finos.org/disallowed: "true"
provisioner: disk.csi.azure.com
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
parameters:
  skuname: Standard_LRS
---
# CN13: default and maximum container resources, and a namespace quota.
apiVersion: v1
kind: LimitRange
metadata:
  name: ccc-limitrange
  namespace: ccc-test
spec:
  limits:
    - type: Container
      default: { cpu: 100m, memory: 128Mi }
      defaultRequest: { cpu: 50m, memory: 64Mi }
      # The azure-cli workload identity probe needs ~512Mi.
      max: { cpu: 500m, memory: 1Gi }
      min: { cpu: 10m, memory: 16Mi }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ccc-quota
  namespace: ccc-test
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "20"
---
# CN04.AR01 / CN03.AR02 / CN10: native admission policies.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ccc-deny-tag-only-images
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: "object.spec.containers.all(c, c.image.contains('@sha256:') || c.image.contains('@sha512:')) && (!has(object.spec.initContainers) || object.spec.initContainers.all(c, c.image.contains('@sha256:') || c.image.contains('@sha512:')))"
      message: images must be digest-pinned
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ccc-deny-tag-only-images
spec:
  policyName: ccc-deny-tag-only-images
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: ["ccc-test"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ccc-deny-static-cloud-credentials
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: "!object.spec.containers.exists(c, has(c.env) && c.env.exists(e, e.name in ['AWS_ACCESS_KEY_ID','AWS_SECRET_ACCESS_KEY','AZURE_CLIENT_SECRET','GOOGLE_APPLICATION_CREDENTIALS']))"
      message: static cloud credentials must not be embedded in workloads
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ccc-deny-static-cloud-credentials
spec:
  policyName: ccc-deny-static-cloud-credentials
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: ["ccc-test"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ccc-deny-blocked-storage-class
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["persistentvolumeclaims"]
  validations:
    - expression: "!has(object.spec.storageClassName) || object.spec.storageClassName != 'ccc-blocked-sc'"
      message: disallowed storage class
    - expression: "object.spec.accessModes.all(m, m != 'ReadWriteMany')"
      message: disallowed access mode
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ccc-deny-blocked-storage-class
spec:
  policyName: ccc-deny-blocked-storage-class
  validationActions: ["Deny"]
---
# CN06 listeners (busybox httpd), digest-pinned for the ccc-test image policy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccc-control
  namespace: ccc-network-control
  labels: { app: ccc-control }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ccc-control }
  template:
    metadata:
      labels: { app: ccc-control }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: listener
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args: ["mkdir -p /tmp/www && echo ok >/tmp/www/health && exec httpd -f -p 8080 -h /tmp/www"]
          ports:
            - { containerPort: 8080, name: http }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 1
            periodSeconds: 2
---
