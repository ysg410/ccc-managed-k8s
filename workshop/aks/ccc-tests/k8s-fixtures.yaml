# CN05.AR02 inspects exactly one running pod labelled role=security-probe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccc-security-probe
  namespace: ccc-test
  labels: { app: ccc-security-probe }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: ccc-security-probe }
  template:
    metadata:
      labels: { app: ccc-security-probe, role: security-probe }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sleep
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["sleep", "infinity"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
