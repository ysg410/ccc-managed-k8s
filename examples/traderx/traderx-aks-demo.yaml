  name: nats-config
  namespace: traderx
---
apiVersion: v1
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          preferred_ip_protocol: "ip4"
kind: ConfigMap
