      "tags": [
        "traderx",
        "runtime",
        "provisioned"
      ],
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timezone": "browser",
      "title": "TraderX Runtime Health",
      "uid": "traderx-runtime-health"
    }
  traderx-spring-actuator-overview.json: |
    {
      "uid": "traderx-spring-actuator-overview",
      "title": "TraderX Spring Actuator Overview",
      "schemaVersion": 39,
      "refresh": "10s",
      "tags": ["traderx", "spring", "prometheus", "provisioned"],
      "time": { "from": "now-30m", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "instance",
            "type": "query",
            "label": "Instance",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(up{job=\"traderx-spring-boot-actuator\"}, instance)",
            "includeAll": true,
            "multi": true,
            "current": { "text": "All", "value": ["$__all"] }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "HTTP Request Rate (req/s)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            { "refId": "A", "expr": "sum by (instance) (rate(http_server_requests_seconds_count{job=\"traderx-spring-boot-actuator\",instance=~\"$instance\"}[5m]))" }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "HTTP p95 Latency (s)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.95, sum by (instance, le) (rate(http_server_requests_seconds_bucket{job=\"traderx-spring-boot-actuator\",instance=~\"$instance\"}[5m])))" }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "JVM Heap Used (bytes)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            { "refId": "A", "expr": "sum by (instance) (jvm_memory_used_bytes{job=\"traderx-spring-boot-actuator\",area=\"heap\",instance=~\"$instance\"})" }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Actuator Targets Up",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            { "refId": "A", "expr": "sum(up{job=\"traderx-spring-boot-actuator\",instance=~\"$instance\"})" }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          }
        }
      ]
    }
  traderx-spring-service-sli.json: |
    {
      "uid": "traderx-spring-service-sli",
      "title": "TraderX Spring Service SLI",
      "schemaVersion": 39,
      "refresh": "10s",
      "tags": ["traderx", "spring", "sli", "prometheus", "provisioned"],
      "time": { "from": "now-30m", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "instance",
            "type": "query",
            "label": "Instance",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(up{job=\"traderx-spring-boot-actuator\"}, instance)",
            "includeAll": true,
            "multi": true,
            "current": { "text": "All", "value": ["$__all"] }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Scrape Target Availability Ratio",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(up{job=\"traderx-spring-boot-actuator\",instance=~\"$instance\"}) / clamp_min(count(up{job=\"traderx-spring-boot-actuator\",instance=~\"$instance\"}), 1)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 0.9 },
                  { "color": "green", "value": 1.0 }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "HTTP 5xx Rate (req/s)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 18, "x": 6, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (instance) (rate(http_server_requests_seconds_count{job=\"traderx-spring-boot-actuator\",status=~\"5..\",instance=~\"$instance\"}[5m]))"
            }
          ],
          "options": { "legend": { "displayMode": "table", "placement": "bottom" } }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Process CPU Usage (%)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * max by (instance) (process_cpu_usage{job=\"traderx-spring-boot-actuator\",instance=~\"$instance\"})"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0 } }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "GC Pause p95 (s)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (instance, le) (rate(jvm_gc_pause_seconds_bucket{job=\"traderx-spring-boot-actuator\",instance=~\"$instance\"}[5m])))"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Live Threads",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 14 },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (instance) (jvm_threads_live_threads{job=\"traderx-spring-boot-actuator\",instance=~\"$instance\"})"
            }
          ],
          "options": { "legend": { "displayMode": "table", "placement": "bottom" } }
        }
      ]
    }
kind: ConfigMap
metadata:
  name: observability-grafana-dashboards
  namespace: traderx
---
apiVersion: v1
data:
  datasources.yaml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090/prometheus
        isDefault: true

      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100

      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        jsonData:
          httpMethod: GET
          tracesToLogs:
            datasourceUid: loki
          serviceMap:
            datasourceUid: prometheus
kind: ConfigMap
metadata:
  name: observability-grafana-datasources
  namespace: traderx
---
apiVersion: v1
data:
  config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      path_prefix: /tmp/loki
      storage:
        filesystem:
          chunks_directory: /tmp/loki/chunks
          rules_directory: /tmp/loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      allow_structured_metadata: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h
kind: ConfigMap
metadata:
  name: observability-loki-config
  namespace: traderx
---
apiVersion: v1
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 1s

    exporters:
      logging:
        verbosity: normal
      prometheus:
        endpoint: 0.0.0.0:8889
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/tempo, logging]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus, logging]
kind: ConfigMap
metadata:
  name: observability-otel-collector-config
  namespace: traderx
---
apiVersion: v1
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        metrics_path: /prometheus/metrics
        static_configs:
          - targets: ["prometheus:9090"]

      - job_name: otel-collector
        static_configs:
          - targets: ["otel-collector:8888", "otel-collector:8889", "otel-collector:13133"]

      - job_name: blackbox-exporter
        static_configs:
          - targets: ["blackbox-exporter:9115"]

      - job_name: traderx-spring-boot-actuator
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["account-service:18088", "position-service:18090", "trade-processor:18091", "trade-service:18092", "order-matcher:18110"]

      - job_name: traderx-http-probe
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - http://edge-proxy:8080/health
              - http://edge-proxy:8080/
              - http://reference-data:18085/stocks
              - http://price-publisher:18100/health
              - http://price-publisher:18100/prices/IBM
              - http://account-service:18088/account/22214
              - http://people-service:18089/swagger
              - http://position-service:18090/health/alive
              - http://trade-processor:18091/system/health
              - http://trade-service:18092/v3/api-docs
              - http://web-front-end-angular:18093/
              - http://nats-broker:8222/varz
              - http://order-matcher:18110/health
              - http://order-matcher:18110/orders/open-count
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115


      - job_name: order-matcher
        metrics_path: /metrics
        static_configs:
          - targets: ["order-matcher:18110"]
kind: ConfigMap
metadata:
  name: observability-prometheus-config
  namespace: traderx
